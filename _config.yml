# Keep GitHub Pages' default theme for the Jekyll-rendered root README.md page
# (the translated READMEs live in .github/, which Jekyll excludes);
# docs/ pages use the custom "doc" layout below.
theme: jekyll-theme-primer

defaults:
  - scope:
      path: "docs"
    values:
      layout: "doc"

# Repo tooling and the app's string resources, not site content (tools/ holds the CI scripts;
# app-strings/ is the translation source, see app-strings/README.md).
exclude:
  - tools/
  - app-strings/
