# Keep every page's "last modified" date honest without anyone remembering to.
#
# The dates live in three hand-maintained places (front matter, JSON-LD + the
# visible <time>, and sitemap.xml), so a content edit that updates only some of
# them leaves the page claiming it is older than it is — which is exactly what
# happened on 2026-08-28, twice in a row, and on 2026-07-30 before that.
#
# tools/sync-content-dates.py derives each date from the last commit that
# changed the file's *content*, so this workflow's own commits (date stamps
# only) are ignored and it settles after one pass.
name: Sync content dates

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'i18n/**/index.html'
      - 'docs/**/*.md'
      - 'sitemap.xml'
      - 'tools/sync-content-dates.py'
  workflow_dispatch:

# A push by GITHUB_TOKEN does not start another workflow run, so this cannot
# loop; the actor guard is belt-and-braces for a future token change.
concurrency:
  group: sync-content-dates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the script reads each file's commit log to find the
          # last real content change. A shallow clone would misdate everything.
          fetch-depth: 0

      - name: Sync dates
        run: python3 tools/sync-content-dates.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "nothing to do"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync page dates with git' \
                     -m 'Automated by .github/workflows/sync-content-dates.yml.'
          git push

  # Ping IndexNow (Bing, Yandex, Seznam, Naver, ...) with the pages this push
  # changed, once GitHub Pages has deployed it, so the engines fetch the new
  # content rather than the old. Google ignores IndexNow and keeps using
  # sitemap.xml. The bot's date-only commit above is not a push by a person,
  # and tools/indexnow.py ignores date-only diffs anyway, so nothing is sent twice.
  indexnow:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages to deploy this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Wait until a github-pages deployment that contains this commit is
          # live: its own, or a later one. Look among recent deployments rather
          # than at the latest: a later push (or the date-sync commit) may already
          # have overtaken it, and Pages then cancels this commit's deployment
          # (2026-11-19: 56c7ce6 errored, e8d335c built 9 s later with the same
          # content). Only a failed deployment with nothing newer on main is a
          # real failure.
          # Deployments, not pages/builds: on 2026-11-26 pages/builds recorded
          # 7aa51e6's build under the previous commit, e1646dc, and this step
          # waited out its 10 minutes for a page that had been live all along.
          repo="${{ github.repository }}"
          for i in $(seq 1 60); do
            git fetch -q origin main
            deps=$(gh api "repos/$repo/deployments?environment=github-pages&per_page=10" \
              --jq '.[] | "\(.id) \(.sha)"')
            own=""
            while read -r id commit; do
              [ -n "$id" ] || continue
              git merge-base --is-ancestor "$SHA" "$commit" 2>/dev/null || continue
              state=$(gh api "repos/$repo/deployments/$id/statuses?per_page=1" --jq '.[0].state // "pending"')
              [ "$state" = success ] && { echo "deployed in $commit"; exit 0; }
              [ "$commit" = "$SHA" ] && [ -z "$own" ] && own=$state
            done <<< "$deps"
            echo "attempt $i: ${own:-pending}"
            case "$own" in failure|error)
              [ "$(git rev-parse origin/main)" = "$SHA" ] && { echo "Pages deployment failed"; exit 1; } ;;
            esac
            sleep 10
          done
          echo "Pages did not deploy $SHA within 10 minutes"
          exit 1

      - name: Submit changed pages
        run: python3 tools/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
